<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 12: CSS Grid Terminology</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #0f172a;
        }
        p.subtitle {
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: #64748b;
        }
        
        /* The Grid Container (The City Map) */
        .grid-container {
            display: grid;
            /* 3 equal columns */
            grid-template-columns: repeat(3, 1fr); 
            /* 3 rows */
            grid-template-rows: repeat(3, 100px); 
            /* Spacing between cells */
            gap: 20px; 
            
            width: 100%;
            max-width: 800px;
            background-color: #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            border: 4px dashed #94a3b8;
        }

        /* The Grid Items (The City Buildings) */
        .grid-item {
            background-color: #10b981;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Special Item to show spanning across lines */
        .item-span {
            background-color: #f59e0b;
            grid-column: 1 / 3; /* Spans from Line 1 to Line 3 (takes up 2 columns) */
        }
        
        .label {
            font-size: 0.9rem;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>CSS Grid: Rows, Columns & Gaps</h1>
    <p class="subtitle">A 2-Dimensional layout (3x3). Notice the 20px gap representing the "streets" between blocks.</p>

    <!-- The Box Layout -->
    <div class="grid-container">
        <!-- Row 1 -->
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        
        <!-- Row 2 -->
        <div class="grid-item item-span">
            4
            <span class="label">(Spans Col Line 1 to 3)</span>
        </div>
        <div class="grid-item">5</div>
        
        <!-- Row 3 -->
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
    </div>

</body>
</html>
